[platformio]
default_envs = nodemcuv2_sd_soft_tx_public

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
lib_deps =
  miguelbalboa/MFRC522@1.4.12
  adafruit/RTClib@2.1.4
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit GFX Library@1.12.1
  adafruit/Adafruit BusIO@1.17.4
  bblanchon/ArduinoJson@6.21.5

[env:nodemcuv2_sd]
extends = env:nodemcuv2
build_flags = -DPDKS_ENABLE_SD=1

[env:nodemcuv2_sd_soft]
extends = env:nodemcuv2
build_flags =
  -DPDKS_ENABLE_SD=1
  -DPDKS_SD_SOFTSPI=1
  -DPDKS_ENABLE_BUZZER=0
  -DSPI_DRIVER_SELECT=3

[env:nodemcuv2_sd_soft_tx]
extends = env:nodemcuv2
build_flags =
  -DPDKS_ENABLE_SD=1
  -DPDKS_SD_SOFTSPI=1
  -DPDKS_ENABLE_BUZZER=1
  -DPDKS_BUZZER_GPIO=1
  -DPDKS_UART_LOGGING=0
  -DPDKS_BOOT_BEEP_TEST=1
  -DSPI_DRIVER_SELECT=3
  -DPDKS_ENABLE_OTA=1

; Public OTA image: no embedded device/AP password. Existing private auth file required.
[env:nodemcuv2_sd_soft_tx_public]
extends = env:nodemcuv2_sd_soft_tx
build_flags =
  ${env:nodemcuv2_sd_soft_tx.build_flags}
  -DPDKS_PUBLIC_RELEASE=1
  -DPDKS_FIRMWARE_VERSION=\"1.5.4\"
  -DPDKS_FIRMWARE_SEQUENCE=10504UL
  -DPDKS_ADMIN_PASSWORD=\"\"
  -DPDKS_AP_PASSWORD=\"\"

